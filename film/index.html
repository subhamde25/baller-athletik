<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d0f12;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <!-- scenes -->
      <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="0" data-duration="10.75" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="brand" data-composition-id="brand" data-composition-src="compositions/brand.html" data-start="10.75" data-duration="3.35" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="benefits" data-composition-id="benefits" data-composition-src="compositions/benefits.html" data-start="14.1" data-duration="4.27" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="science" data-composition-id="science" data-composition-src="compositions/science.html" data-start="18.37" data-duration="4.46" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="22.83" data-duration="5.17" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="28" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- cross-scene transitions: cloud wipes, fly-throughs, film burn, flash -->
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="32" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <!-- every caption group lives on one captions track -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="28" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="watermark" data-composition-id="watermark" data-composition-src="compositions/watermark.html" data-start="0" data-duration="32" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- voice + music -->
      <audio id="vo" class="clip" src="assets/audio/vo.wav" data-start="0.25" data-track-index="10" data-volume="0.76"></audio>
      <audio id="bgm" class="clip" src="assets/audio/bgm.wav" data-start="0" data-track-index="11" data-volume="0.2"></audio>

      <!-- sound effects: each on a visible cause, peak one frame after its picture -->
      <audio id="sfx-alarm" class="clip" src="assets/audio/sfx/alarm.mp3" data-start="0" data-track-index="12" data-duration="2.48" data-volume="0.4"></audio>
      <audio id="sfx-nope" class="clip" src="assets/audio/sfx/pop.mp3" data-start="2.14" data-track-index="13" data-duration="0.72" data-volume="0.45"></audio>
      <audio id="sfx-clouds" class="clip" src="assets/audio/sfx/swoosh-air.mp3" data-start="2.7" data-track-index="14" data-duration="1.58" data-volume="0.4"></audio>
      <audio id="sfx-rustle" class="clip" src="assets/audio/sfx/rustle.mp3" data-start="5.9" data-track-index="15" data-duration="2.00" data-volume="2.4"></audio>
      <audio id="sfx-punch" class="clip" src="assets/audio/sfx/push-whoosh.mp3" data-start="7.19" data-track-index="16" data-duration="0.42" data-volume="0.35"></audio>
      <audio id="sfx-riser" class="clip" src="assets/audio/sfx/impact-bass-1.mp3" data-start="8.83" data-track-index="17" data-duration="2.12" data-volume="0.24"></audio>
      <audio id="sfx-mark" class="clip" src="assets/audio/sfx/brand-twinkle.mp3" data-start="10.67" data-track-index="18" data-duration="2.60" data-volume="0.45"></audio>
      <audio id="sfx-deep" class="clip" src="assets/audio/sfx/shimmer.mp3" data-start="12.31" data-track-index="19" data-duration="2.48" data-volume="0.85"></audio>
      <audio id="sfx-dive" class="clip" src="assets/audio/sfx/dive-whoosh.mp3" data-start="14.0" data-track-index="20" data-duration="0.49" data-volume="0.42"></audio>
      <audio id="sfx-cut10" class="clip" src="assets/audio/sfx/push-whoosh.mp3" data-start="15.76" data-track-index="21" data-duration="0.42" data-volume="0.3"></audio>
      <audio id="sfx-charge" class="clip" src="assets/audio/sfx/charge-ticks.wav" data-start="16.99" data-track-index="22" data-duration="1.00" data-volume="0.55"></audio>
      <audio id="sfx-scribble" class="clip" src="assets/audio/sfx/pencil-sketch.mp3" data-start="9.88" data-track-index="32" data-duration="1.90" data-volume="0.4"></audio>
      <audio id="sfx-roll" class="clip" src="assets/audio/sfx/click-soft.mp3" data-start="27.0" data-track-index="33" data-duration="0.37" data-volume="0.35"></audio>
      <audio id="sfx-whip" class="clip" src="assets/audio/sfx/swoosh-air.mp3" data-start="17.95" data-track-index="23" data-duration="1.58" data-volume="0.35"></audio>
      <audio id="sfx-pulse" class="clip" src="assets/audio/sfx/pulse.mp3" data-start="18.42" data-track-index="24" data-duration="2.48" data-volume="0.4"></audio>
      <audio id="sfx-graph" class="clip" src="assets/audio/sfx/light-shimmer.mp3" data-start="20.95" data-track-index="25" data-duration="2.40" data-volume="0.14"></audio>
      <audio id="sfx-swap" class="clip" src="assets/audio/sfx/swoosh-air.mp3" data-start="22.4" data-track-index="26" data-duration="1.58" data-volume="0.3"></audio>
      <audio id="sfx-cut17" class="clip" src="assets/audio/sfx/push-whoosh.mp3" data-start="25.19" data-track-index="27" data-duration="0.42" data-volume="0.3"></audio>
      <audio id="sfx-cut18" class="clip" src="assets/audio/sfx/swoosh-air.mp3" data-start="26.12" data-track-index="28" data-duration="1.58" data-volume="0.4"></audio>
      <audio id="sfx-dive-end" class="clip" src="assets/audio/sfx/iris-whoosh.mp3" data-start="27.15" data-track-index="29" data-duration="4.05" data-volume="0.35"></audio>
      <audio id="sfx-endmark" class="clip" src="assets/audio/sfx/brand-twinkle.mp3" data-start="28.06" data-track-index="30" data-duration="2.60" data-volume="0.4"></audio>
      <audio id="sfx-button" class="clip" src="assets/audio/sfx/pop.mp3" data-start="29.25" data-track-index="31" data-duration="0.72" data-volume="0.4"></audio>
      <audio id="sfx-dream" class="clip" src="assets/audio/sfx/light-shimmer.mp3" data-start="2.95" data-track-index="34" data-duration="2.40" data-volume="0.12"></audio>
      <audio id="sfx-fall" class="clip" src="assets/audio/sfx/swoosh-air.mp3" data-start="5.47" data-track-index="35" data-duration="1.58" data-volume="0.35"></audio>
      <audio id="sfx-ring" class="clip" src="assets/audio/sfx/pop.mp3" data-start="12.33" data-track-index="36" data-duration="0.72" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
